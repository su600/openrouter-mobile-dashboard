services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: su600/openrouter-mobile-dashboard:local-9000
    container_name: openrouter-mobile-dashboard-9000
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9000:9000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
